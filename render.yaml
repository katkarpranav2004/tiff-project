# Render blueprint for the TISS Incube API (Express + Prisma).
# Frontend is deployed separately on Vercel (see vercel.json / client).
services:
  - type: web
    name: tiss-incube-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate --schema ../prisma/schema.prisma && npm run build
    startCommand: npx prisma migrate deploy --schema ../prisma/schema.prisma && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set the rest as secrets in the Render dashboard (sync:false = not stored in repo):
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
